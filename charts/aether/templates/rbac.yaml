{{- if .Values.rbac.create }}
# Everything this app's ServiceAccount can do, scoped to this namespace only —
# no ClusterRole, since the app only ever watches/manages its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aether.fullname" . }}
  labels:
    {{- include "aether.labels" . | nindent 4 }}
rules:
  # Pods tab: read-only, to watch and display the running pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pod detail panel: container logs, and events explaining why a pod is unhealthy.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Launch tab creates; Pods tab's manage panel reads back, scales/edits
  # resources+env (update), and deletes a deployment the owner launched.
  # `list` backs quota accounting (backend/src/quota.rs), which sums each
  # owner's reserved footprint from Deployment specs — desired state, which
  # is correct the instant it's written — rather than from observed pods,
  # which lag a launch by a second or two and double-count mid-rollout.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "update", "delete"]
  # Launched apps may get their own Service (LoadBalancer or ClusterIP,
  # depending on the template); `get` is also used by the reverse proxy
  # (backend/src/proxy.rs) to look up a proxy-enabled deployment's
  # ClusterIP to connect to; `delete` for the Pods tab's manage panel
  # removing a deployment's Service too.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aether.fullname" . }}
  labels:
    {{- include "aether.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aether.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "aether.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
