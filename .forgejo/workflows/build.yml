name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: docker
    env:
      REGISTRY: ctr.int.example.com:8443
      IMAGE: ctr.int.example.com:8443/aether
      DEPLOY_REPO: git.example.com/Aether/Aether-Deploy.git
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build image
        run: |
          TAG="$(git rev-parse --short HEAD)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Push image
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"

      # GitOps deploy: this app's manifests + Argo CD Application live in
      # the separate Aether-Deploy repo, not here — this job only ever
      # touches the registry and that other repo's git history, never the
      # cluster itself. Argo CD (running in-cluster, watching Aether-Deploy)
      # is what actually rolls the new image out.
      - name: Bump image tag in Aether-Deploy
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          KUSTOMIZE="$PWD/kustomize"

          git clone "https://aether-ci:${{ secrets.FORGEJO_DEPLOY_TOKEN }}@$DEPLOY_REPO" /tmp/aether-deploy
          cd /tmp/aether-deploy
          "$KUSTOMIZE" edit set image "$IMAGE=$IMAGE:$TAG"

          if git diff --quiet -- kustomization.yaml; then
            echo "kustomization.yaml unchanged, nothing to deploy"
            exit 0
          fi

          git config user.name "aether-ci"
          git config user.email "ci@example.com"
          git add kustomization.yaml
          git commit -m "deploy: bump aether image to $TAG"
          git push origin HEAD:main
          cd /
          rm -rf /tmp/aether-deploy "$KUSTOMIZE"
