name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: docker
    env:
      REGISTRY: ctr.int.example.com:8443
      IMAGE: ctr.int.example.com:8443/aether/aether
      DEPLOY_REPO: git.example.com/Aether/Aether-Deploy.git
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We only need this repo's source to build the image - nothing
          # later needs to run authenticated git commands against it. Left
          # at the default (true), checkout persists its own auto-injected
          # credential (scoped only to this repo) into the job's git config,
          # which then collides with the explicit AETHER_DEPLOY_TOKEN the
          # "Bump image tag" step uses to clone the separate Aether-Deploy
          # repo on the same git host.
          persist-credentials: false

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build image
        run: |
          TAG="$(git rev-parse --short HEAD)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Push image
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"

      # GitOps deploy: this app's manifests + Argo CD Application live in
      # the separate Aether-Deploy repo, not here — this job only ever
      # touches the registry and that other repo's git history, never the
      # cluster itself. Argo CD (running in-cluster, watching Aether-Deploy)
      # is what actually rolls the new image out.
      - name: Bump image tag in Aether-Deploy
        run: |
          # Forgejo injects its own GITHUB_TOKEN into every job for
          # actions/* compatibility. install_kustomize.sh sends whatever
          # GITHUB_TOKEN is set to api.github.com to look up the latest
          # release; GitHub rejects our Forgejo token as "Bad credentials"
          # and the script dies with "Invalid GITHUB_TOKEN" before
          # kustomize is even downloaded. Unset it so the lookup goes
          # through unauthenticated instead.
          unset GITHUB_TOKEN
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          KUSTOMIZE="$PWD/kustomize"

          # Forgejo's PAT convention is token-only in the URL (no
          # username) - "user:token@" pairs get checked as real Basic
          # Auth credentials and fail with "Credentials are incorrect
          # or have expired" unless "user" happens to be the token's
          # actual owner account.
          git clone "https://${{ secrets.AETHER_DEPLOY_TOKEN }}@$DEPLOY_REPO" /tmp/aether-deploy
          cd /tmp/aether-deploy
          "$KUSTOMIZE" edit set image "$IMAGE=$IMAGE:$TAG"

          if git diff --quiet -- kustomization.yaml; then
            echo "kustomization.yaml unchanged, nothing to deploy"
            exit 0
          fi

          git config user.name "aether-ci"
          git config user.email "ci@example.com"
          git add kustomization.yaml
          git commit -m "deploy: bump aether image to $TAG"
          git push origin HEAD:main
          cd /
          rm -rf /tmp/aether-deploy "$KUSTOMIZE"
