# Argo CD's binding of this repo's k8s/ directory to the aether namespace.
# Applied once directly (`kubectl apply -f argocd/application.yaml`), not
# part of k8s/kustomization.yaml itself — Argo CD manages the *contents* of
# k8s/, it isn't one of the things k8s/ deploys. From this point on, Argo CD
# owns `kubectl apply -k k8s/`; don't run that by hand, it'll just fight
# selfHeal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aether
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@git.example.com:2022/Aether/Aether-Web.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: aether
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
