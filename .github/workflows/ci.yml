name: ci

# Public mirror's CI. The Forgejo workflow (.forgejo/workflows/build.yml)
# still serves the internal deploy path against the private registry/cluster
# and is unaffected by this — this is a parallel, independent pipeline for
# the public GitHub repo.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test and lint (Rust)
    runs-on: ubuntu-24.04
    container: rust:1-slim-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Test and lint
        run: |
          rustup component add clippy
          rustup target add wasm32-unknown-unknown
          cargo test --locked -p backend -p common
          cargo clippy --locked --all-targets -p backend -p common -- -D warnings
          cd frontend && cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

  helm:
    name: Helm lint and guard matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: |
          helm lint charts/aether \
            --set host=aether.example.com \
            --set database.deploy.enabled=true \
            --set ingress.tls.issuerRef.name=test-issuer

      - name: Guard matrix (each guard fires; representative renders succeed)
        run: ./.github/scripts/helm-guard-matrix.sh
