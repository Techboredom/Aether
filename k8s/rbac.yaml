# Everything this app's ServiceAccount can do, scoped to this namespace only —
# no ClusterRole, since the app only ever watches/manages its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aether
  namespace: ollama
rules:
  # Pods tab: read-only, to watch and display the running pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pod detail panel: container logs, and events explaining why a pod is unhealthy.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Reverse proxy for proxy-enabled templates (backend/src/proxy.rs): tunnels
  # to the pod directly, the same mechanism `kubectl port-forward` uses.
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Create-deployment tab: only enough to create a Deployment and read it back.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get"]
  # Launched apps get their own LoadBalancer Service (no ingress controller yet).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aether
  namespace: ollama
subjects:
  - kind: ServiceAccount
    name: aether
    namespace: ollama
roleRef:
  kind: Role
  name: aether
  apiGroup: rbac.authorization.k8s.io
