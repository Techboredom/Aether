apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether
  namespace: aether
  labels:
    app: aether
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aether
  template:
    metadata:
      labels:
        app: aether
    spec:
      serviceAccountName: aether
      # The image is amd64-only (built by CI on an amd64 box); the cluster's
      # arm64 nodes are the dedicated MetalLB speaker/controller pool.
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: regcred
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aether
          image: ctr.int.example.com:8443/aether:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            # Always watches whichever namespace it's deployed into.
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Postgres connection string for the image catalog. Create this
            # secret yourself, e.g.:
            #   kubectl create secret generic aether-db -n aether \
            #     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/dbname'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aether-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/pods
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/pods
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
