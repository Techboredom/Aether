<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Aether">
  <title>Aether</title>
  <defs>
    <!-- Accent blue into the violet used by the background glows, so the mark
         is drawn from the same palette as the rest of the theme. -->
    <linearGradient id="aether-g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#7a5adc"/>
    </linearGradient>

    <!-- Knocks the orbit out of the core's footprint so the ellipse reads as
         passing *behind* the ring rather than through it. The radius is the
         ring's outer edge plus a hairline, which keeps a visible gap at 16px
         instead of the two strokes merging into a blob. -->
    <mask id="aether-behind">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="32" r="15.5" fill="#000"/>
    </mask>
  </defs>

  <g fill="none" stroke="url(#aether-g)" stroke-linecap="round">
    <ellipse cx="32" cy="32" rx="26" ry="11" stroke-width="3.5"
             transform="rotate(-25 32 32)" mask="url(#aether-behind)"/>
    <circle cx="32" cy="32" r="12" stroke-width="5"/>
  </g>
</svg>
