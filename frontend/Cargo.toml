[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { version = "0.1.0", path = "../common" }
console_error_panic_hook = "0.1.7"
futures = "0.3.34"
gloo-net = { version = "0.7.0", features = ["websocket", "http"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.104"
leptos = { version = "0.8.20", features = ["csr"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = ["Window", "Location"] }
